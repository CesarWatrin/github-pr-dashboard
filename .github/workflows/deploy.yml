name: Sync and deploy

on:
  schedule:
    # Every 15 minutes, Monday to Friday, from 6/7 am to 8/9 pm Paris time (cron runs in UTC).
    # Off the hour marks: GitHub delays or drops scheduled runs most at the start of the hour.
    - cron: '7,22,37,52 5-19 * * 1-5'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        description: Refetch the whole rolling window instead of an incremental sync
        type: boolean
        default: false
      # Once FULL_SYNC_PASSWORD is set, a full sync needs it: the page signs the request with that password.
      proof:
        description: Proof of the full sync password, set by the page (leave empty)
        type: string
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    # The first sync after a snapshot format change reads a whole year of PRs and Actions runs; the two years before it
    # come back a month per run.
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-again.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # The raw pull requests snapshot is never published: it only lives in the Actions cache.
      - name: Restore snapshot
        uses: actions/cache/restore@v6
        with:
          path: .cache/snapshot.json
          key: snapshot-${{ github.run_id }}
          restore-keys: snapshot-

      # The logs show the env of each step, inputs in clear: the proof is masked first, read from the event rather than
      # written into the command. Only the characters of a proof are kept, so that no other workflow command slips in;
      # anything else is no valid proof anyway.
      - name: Mask the proof of the full sync
        if: inputs.proof
        run: echo "::add-mask::$(jq -r '.inputs.proof' "$GITHUB_EVENT_PATH" | tr -cd '0-9a-f.')"

      # Every value is a secret so that the public logs show none of them, the organization included.
      - name: Sync pull requests
        run: node scripts/sync.mjs
        env:
          ORG: ${{ secrets.ORG }}
          GITHUB_TOKEN: ${{ secrets.ORG_STATS_TOKEN }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          REPO_CATEGORIES: ${{ secrets.REPO_CATEGORIES }}
          BOT_USERS: ${{ secrets.BOT_USERS }}
          REQUIRED_APPROVALS: ${{ secrets.REQUIRED_APPROVALS }}
          SQUADS: ${{ secrets.SQUADS }}
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          FULL_SYNC: ${{ inputs.full }}
          FULL_SYNC_PASSWORD: ${{ secrets.FULL_SYNC_PASSWORD }}
          RETRO_KEY: ${{ secrets.RETRO_KEY }}
          FULL_SYNC_PROOF: ${{ inputs.proof }}
          BUILD_ID: ${{ github.sha }}

      - name: Save snapshot
        uses: actions/cache/save@v6
        with:
          path: .cache/snapshot.json
          key: snapshot-${{ github.run_id }}

      - name: Stamp the build
        run: sed -i "s/__BUILD__/${GITHUB_SHA}/g" site/index.html

      - uses: actions/configure-pages@v6

      # A re-run keeps the artifacts of the attempts before it, and the deployment refuses to pick among several of the
      # same name: each attempt uploads and deploys its own.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
          name: github-pages-${{ github.run_attempt }}

      # GitHub Pages refuses a deployment while the one before is still finishing, as when two runs follow each other
      # closely: then the run waits a minute and tries once more, rather than fail.
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

      - name: Wait for the deployment before
        if: steps.deployment.outcome == 'failure'
        run: sleep 60

      - name: Deploy to GitHub Pages, once more
        id: deployment-again
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
