name: Checks

# Every pull request: syntax and tests, on made-up data. No environment, so no secret: a pull request cannot read them.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Syntax
        run: npm run check

      - name: Tests
        run: npm test
