name: Checks

# Every pull request: syntax, types and tests, on made-up data, the page included in the Chrome of the runner. No
# environment, so no secret: a pull request cannot read them.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # TypeScript, only to check the types of the JSDoc: the page runs the same files, without any build.
      - name: Install the type checker
        run: npm ci

      - name: Syntax
        run: npm run check

      - name: Types
        run: npm run typecheck

      - name: Tests
        run: npm test
