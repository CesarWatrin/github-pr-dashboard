name: Checks

# Every pull request: syntax, types, the rules and the architecture, then the page in the Chrome of the runner, on
# made-up data. No environment, so no secret: a pull request cannot read them. Each check is a step of its own, so that
# the one that fails shows at once.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # TypeScript, only to check the types of the JSDoc: the page runs the same files, without any build.
      - name: Install the type checker
        run: npm ci

      - name: Syntax
        run: npm run check

      # Strict on the rules, never any.
      - name: Types
        run: npm run typecheck

      # The rules of the page and of the sync, the module block of index.html, the layers, cycles and headers.
      - name: Rules and architecture
        run: npm run test:unit

      # Every page in Chrome, preinstalled on the runner: shown without error, filled, dialogs and filters working.
      - name: The page in Chrome
        timeout-minutes: 5
        run: npm run test:browser
