<!doctype html>
<!-- The year in review (« Rétrospective »), a page apart from the dashboard, for the whole team: it opens with the key its
     link carries after the #, and leads nowhere else. Always dark. -->
<html lang="fr" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rétrospective</title>
    <meta name="robots" content="noindex, nofollow" />
    <!-- Nothing of the address goes to another site, the avatars of GitHub included. -->
    <meta name="referrer" content="no-referrer" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M8 1.5l1.6 3.9 4.2.3-3.2 2.7 1 4.1L8 10.3l-3.6 2.2 1-4.1-3.2-2.7 4.2-.3Z' fill='%23e8892a'/%3E%3C/svg%3E"
    />
    <!-- The deploy workflow stamps the build placeholder with the commit, so a new deploy never mixes old and new files. -->
    <meta name="build" content="__BUILD__" />
    <!-- In English, the page waits for its English (ui/translate.js), three seconds at most. -->
    <script>
      try {
        if (localStorage.getItem('github-pr-dashboard:language') === 'en') {
          document.documentElement.lang = 'en'
          document.documentElement.dataset.language = 'en'
          setTimeout(() => document.documentElement.classList.add('is-translated'), 3000)
        }
      } catch {}
    </script>
    <!-- The styles, in the order of the cascade, touch.css last. -->
    <link rel="stylesheet" href="styles/base.css?v=__BUILD__" />
    <link rel="stylesheet" href="styles/pages/wrapped.css?v=__BUILD__" />
    <link rel="stylesheet" href="styles/pages/wrapped-motion.css?v=__BUILD__" />
    <link rel="stylesheet" href="styles/motion.css?v=__BUILD__" />
    <link rel="stylesheet" href="styles/touch.css?v=__BUILD__" />
    <!-- modules: written by scripts/module-map.mjs -->
    <script type="importmap">
    {
      "imports": {
        "./domain/math.js": "./domain/math.js?v=__BUILD__",
        "./domain/time.js": "./domain/time.js?v=__BUILD__",
        "./domain/wrapped.js": "./domain/wrapped.js?v=__BUILD__",
        "./domain/wrapped/fun-facts.js": "./domain/wrapped/fun-facts.js?v=__BUILD__",
        "./domain/wrapped/thanks.js": "./domain/wrapped/thanks.js?v=__BUILD__",
        "./lib/english.js": "./lib/english.js?v=__BUILD__",
        "./lib/english/blocks.js": "./lib/english/blocks.js?v=__BUILD__",
        "./lib/english/frame.js": "./lib/english/frame.js?v=__BUILD__",
        "./lib/english/method.js": "./lib/english/method.js?v=__BUILD__",
        "./lib/english/pages.js": "./lib/english/pages.js?v=__BUILD__",
        "./lib/format.js": "./lib/format.js?v=__BUILD__",
        "./lib/i18n.js": "./lib/i18n.js?v=__BUILD__",
        "./model/retro-address.js": "./model/retro-address.js?v=__BUILD__",
        "./pages/wrapped/locked.js": "./pages/wrapped/locked.js?v=__BUILD__",
        "./pages/wrapped/picker.js": "./pages/wrapped/picker.js?v=__BUILD__",
        "./pages/wrapped/slides.js": "./pages/wrapped/slides.js?v=__BUILD__",
        "./pages/wrapped/thanks.js": "./pages/wrapped/thanks.js?v=__BUILD__",
        "./pages/wrapped/visuals.js": "./pages/wrapped/visuals.js?v=__BUILD__",
        "./pages/wrapped/wrapped.js": "./pages/wrapped/wrapped.js?v=__BUILD__",
        "./services/retro-source.js": "./services/retro-source.js?v=__BUILD__",
        "./services/stats-key.js": "./services/stats-key.js?v=__BUILD__",
        "./ui/dom.js": "./ui/dom.js?v=__BUILD__",
        "./ui/github.js": "./ui/github.js?v=__BUILD__",
        "./ui/translate.js": "./ui/translate.js?v=__BUILD__"
      }
    }
    </script>
    <link rel="modulepreload" href="retro.js?v=__BUILD__" />
    <link rel="modulepreload" href="domain/math.js?v=__BUILD__" />
    <link rel="modulepreload" href="domain/time.js?v=__BUILD__" />
    <link rel="modulepreload" href="domain/wrapped.js?v=__BUILD__" />
    <link rel="modulepreload" href="domain/wrapped/fun-facts.js?v=__BUILD__" />
    <link rel="modulepreload" href="domain/wrapped/thanks.js?v=__BUILD__" />
    <link rel="modulepreload" href="lib/format.js?v=__BUILD__" />
    <link rel="modulepreload" href="lib/i18n.js?v=__BUILD__" />
    <link rel="modulepreload" href="model/retro-address.js?v=__BUILD__" />
    <link rel="modulepreload" href="pages/wrapped/locked.js?v=__BUILD__" />
    <link rel="modulepreload" href="pages/wrapped/picker.js?v=__BUILD__" />
    <link rel="modulepreload" href="pages/wrapped/slides.js?v=__BUILD__" />
    <link rel="modulepreload" href="pages/wrapped/thanks.js?v=__BUILD__" />
    <link rel="modulepreload" href="pages/wrapped/visuals.js?v=__BUILD__" />
    <link rel="modulepreload" href="pages/wrapped/wrapped.js?v=__BUILD__" />
    <link rel="modulepreload" href="services/retro-source.js?v=__BUILD__" />
    <link rel="modulepreload" href="services/stats-key.js?v=__BUILD__" />
    <link rel="modulepreload" href="ui/dom.js?v=__BUILD__" />
    <link rel="modulepreload" href="ui/github.js?v=__BUILD__" />
    <link rel="modulepreload" href="ui/translate.js?v=__BUILD__" />
    <!-- /modules -->
    <script type="module" src="retro.js?v=__BUILD__"></script>
  </head>
  <body>
    <!-- Halos of light drifting behind the page (styles/pages/wrapped-motion.css). -->
    <div class="wrapped-halos" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
    <main class="wrapped" data-wrapped aria-label="Rétrospective"></main>
  </body>
</html>
